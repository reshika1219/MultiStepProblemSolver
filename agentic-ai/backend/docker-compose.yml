services:
  api:
    build: .
    env_file: .env
    environment:
      # Inside compose, Mongo is reachable by service name, not localhost.
      MONGO_URI: mongodb://mongodb:27017
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
volumes:
  mongo_data:
